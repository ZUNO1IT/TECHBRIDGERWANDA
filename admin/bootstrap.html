
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>TECHBRIDGE RWANDA — Admin Setup</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(0, 229, 255, 0.14), transparent 35%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.14), transparent 35%),
        #070b14;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 34px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      background: rgba(13, 21, 39, .82);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .logo {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 21px;
      color: #061018;
      background: linear-gradient(135deg, #00e5ff, #3b82f6);
      margin-bottom: 22px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .user-box {
      display: none;
      padding: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      margin-bottom: 18px;
      color: #cbd5e1;
    }

    .user-box strong {
      color: #fff;
      display: block;
      margin-bottom: 5px;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #041018;
      background: linear-gradient(135deg, #00e5ff, #3b82f6);
      transition: .2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .secondary {
      margin-top: 12px;
      background: rgba(255,255,255,.07);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,.1);
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
    }

    .status.info {
      display: block;
      background: rgba(59,130,246,.12);
      color: #93c5fd;
    }

    .status.success {
      display: block;
      background: rgba(34,197,94,.12);
      color: #86efac;
    }

    .status.error {
      display: block;
      background: rgba(239,68,68,.12);
      color: #fca5a5;
    }

    .warning {
      margin-top: 22px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(245,158,11,.08);
      border: 1px solid rgba(245,158,11,.18);
      color: #fbbf24;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">TB</div>

    <h1>Admin Setup</h1>

    <p class="subtitle">
      Securely initialize the first TECHBRIDGE RWANDA administrator
      account.
    </p>

    <div id="userBox" class="user-box">
      <strong id="userEmail">Checking account...</strong>
      <span id="userUid"></span>
    </div>

    <button id="loginBtn">
      Sign In First
    </button>

    <button id="bootstrapBtn" class="hidden">
      Make This Account Admin
    </button>

    <button id="dashboardBtn" class="secondary hidden">
      Go To Admin Dashboard
    </button>

    <div id="status" class="status"></div>

    <div class="warning">
      ⚠️ Use this page only for the first administrator setup.
      Do not expose or modify the Firebase Admin credentials in frontend
      code.
    </div>

  </main>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    import {
      getFunctions,
      httpsCallable
    } from
      "https://www.gstatic.com/firebasejs/12.3.0/firebase-functions.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_WEB_API_KEY",
      authDomain: "techbrige-rwanda.firebaseapp.com",
      projectId: "techbrige-rwanda",
      storageBucket: "techbrige-rwanda.firebasestorage.app",
      messagingSenderId: "391783540774",
      appId: "1:391783540774:web:de825e268d4ed6b2711ee7"
    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const functions = getFunctions(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const userBox = document.getElementById("userBox");
    const userEmail = document.getElementById("userEmail");
    const userUid = document.getElementById("userUid");

    const loginBtn = document.getElementById("loginBtn");
    const bootstrapBtn = document.getElementById("bootstrapBtn");
    const dashboardBtn = document.getElementById("dashboardBtn");

    const statusBox = document.getElementById("status");


    // ==========================================
    // STATUS
    // ==========================================

    function showStatus(message, type = "info") {

      statusBox.textContent = message;

      statusBox.className = `status ${type}`;
    }


    // ==========================================
    // AUTH STATE
    // ==========================================

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        userBox.style.display = "none";

        loginBtn.classList.remove("hidden");

        bootstrapBtn.classList.add("hidden");

        dashboardBtn.classList.add("hidden");

        showStatus(
          "Please sign in with the account that should become the first administrator.",
          "info"
        );

        return;
      }


      userBox.style.display = "block";

      userEmail.textContent =
        user.email || "Authenticated user";

      userUid.textContent =
        `UID: ${user.uid}`;


      loginBtn.classList.add("hidden");

      bootstrapBtn.classList.remove("hidden");


      // Check current token claims.

      try {

        const tokenResult =
          await user.getIdTokenResult(true);

        if (tokenResult.claims.admin === true) {

          bootstrapBtn.classList.add("hidden");

          dashboardBtn.classList.remove("hidden");

          showStatus(
            "This account already has the admin claim.",
            "success"
          );

        } else {

          showStatus(
            "This account is signed in and ready for admin initialization.",
            "info"
          );
        }

      } catch (error) {

        console.error(error);

        showStatus(
          "Could not verify the current account.",
          "error"
        );
      }

    });


    // ==========================================
    // LOGIN BUTTON
    // ==========================================

    loginBtn.addEventListener("click", () => {

      window.location.href =
        "../login.html";

    });


    // ==========================================
    // BOOTSTRAP ADMIN
    // ==========================================

    bootstrapBtn.addEventListener("click", async () => {

      const user = auth.currentUser;

      if (!user) {

        showStatus(
          "Please sign in first.",
          "error"
        );

        return;
      }


      const confirmed = confirm(
        "Are you sure you want to initialize this account as the first TECHBRIDGE RWANDA administrator?"
      );

      if (!confirmed) return;


      bootstrapBtn.disabled = true;

      bootstrapBtn.textContent =
        "Initializing Admin...";


      showStatus(
        "Contacting the secure Firebase backend...",
        "info"
      );


      try {

        const bootstrapAdmin =
          httpsCallable(functions, "bootstrapAdmin");

        const result =
          await bootstrapAdmin({});


        if (result.data?.success) {

          // Force-refresh the ID token so the new
          // custom claim becomes available.

          await user.getIdToken(true);


          showStatus(
            "Admin initialized successfully. Please sign in again to refresh your Firebase session.",
            "success"
          );


          bootstrapBtn.classList.add("hidden");

          dashboardBtn.classList.remove("hidden");

        } else {

          throw new Error(
            "The server did not confirm the admin setup."
          );

        }

      } catch (error) {

        console.error(error);

        let message =
          "Admin initialization failed.";

        if (error?.code === "functions/permission-denied") {

          message =
            "This account is not authorized for the first-admin setup.";

        } else if (error?.code === "functions/unauthenticated") {

          message =
            "Your session has expired. Please sign in again.";

        } else if (error?.message) {

          message =
            error.message;
        }


        showStatus(
          message,
          "error"
        );

      } finally {

        bootstrapBtn.disabled = false;

        bootstrapBtn.textContent =
          "Make This Account Admin";
      }

    });


    // ==========================================
    // ADMIN DASHBOARD
    // ==========================================

    dashboardBtn.addEventListener("click", () => {

      window.location.href =
        "./index.html";

    });

  </script>

</body>
</html>
